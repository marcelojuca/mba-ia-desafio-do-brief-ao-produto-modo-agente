# Ambiente local do produto: ./scripts/up.sh / ./scripts/down.sh
# Projeto padrão "catraca"; COMPOSE_PROJECT_NAME e PORT permitem ambientes paralelos (ex.: worktrees).
name: catraca

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catraca
      POSTGRES_PASSWORD: catraca
      POSTGRES_DB: catraca
      TZ: America/Sao_Paulo
    volumes:
      - db-data:/var/lib/postgresql/data
    # Sem "ports": o Postgres não é publicado no host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catraca -d catraca"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://catraca:catraca@db:5432/catraca
      PARTNER_API_KEY: ${PARTNER_API_KEY:-catraca-parceiro-dev}
      GATEWAY_DELAY_SCALE: ${GATEWAY_DELAY_SCALE:-1}
      TZ: America/Sao_Paulo
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    # Só fica healthy depois de migrar, rodar a seed e abrir a porta (src/main.js).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health | grep -q '\"ok\":true'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  db-data:
